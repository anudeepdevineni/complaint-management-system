# Database — values come from environment variables, with local dev defaults
# after the colon so the app still runs out of the box.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Return the actual error message in the response body (instead of a blank 500).
# Our GlobalExceptionHandler builds the body, but this is a safety net.
server.error.include-message=always

# JWT — secret MUST be at least 32 characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET:mysupersecretkey12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Gemini API key. No default on purpose so the real key is NOT committed.
# If it is empty, AiService automatically falls back to keyword-based classification.
gemini.api.key=${GEMINI_API_KEY:}