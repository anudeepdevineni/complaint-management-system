# All secrets come from environment variables. Nothing secret is stored here.

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Return the error message in the response body instead of a blank 500.
# GlobalExceptionHandler builds the body; this is a fallback.
server.error.include-message=always

# JWT. JWT_SECRET is required and must be at least 32 characters (HS256).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin account, created on startup if it doesn't exist. Admins can't sign up.
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:Admin}

# Escalation: unresolved complaints older than this many hours become ESCALATED.
escalation.after-hours=${ESCALATION_HOURS:48}
escalation.check-interval-ms=3600000

# Google Gemini API key. If empty, AiService falls back to keyword classification.
gemini.api.key=${GEMINI_API_KEY:}
